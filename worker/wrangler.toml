# 提肛陪伴 — 计数服务部署配置
# 用法见 README.md。部署后把返回的 worker 地址填进 app.js 的 COUNTER_ORIGIN。
name = "tigang-counter"
main = "worker.js"
compatibility_date = "2024-11-01"

# 免费计划足够个人站:DO 请求量级、KV 存储配额都很宽裕;WebSocket 长连接免费。

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

# 免费计划要求 Durable Object 必须走 SQLite 后端(new_sqlite_classes),
# 否则报错 code 10097;worker.js 里的 ctx.storage KV 式 API 在 SQLite DO 上同样可用。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]
